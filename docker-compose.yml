services:
  metadata-db:
    image: pgvector/pgvector:pg16
    container_name: pmc-metadata-db
    restart: always
    environment:
      POSTGRES_DB: pmc_metadata_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmc_metadata_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
